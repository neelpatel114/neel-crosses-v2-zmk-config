# Ported from Neel's Lily58 config (neel-lily58-wireless-view-zmk-config/config/lily58.conf)
# Studio itself is enabled per-build in build.yaml (right half only); do not set CONFIG_ZMK_STUDIO here.

# Boost BLE TX power for split link and host range (nRF52840 supports +8 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Same debounce feel as the Lily58
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Skip the studio_unlock step, as on the Lily58
CONFIG_ZMK_STUDIO_LOCKING=n

# OLED on the matrix PCB header (see the &i2c1 block in the keymap)
CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y
CONFIG_SSD1306=y
