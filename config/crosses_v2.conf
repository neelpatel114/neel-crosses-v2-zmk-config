# Ported from Neel's Lily58 config (neel-lily58-wireless-view-zmk-config/config/lily58.conf)
# Studio itself is enabled per-build in build.yaml (right half only); do not set CONFIG_ZMK_STUDIO here.

# Boost BLE TX power for split link and host range (nRF52840 supports +8 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Same debounce feel as the Lily58
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Skip the studio_unlock step, as on the Lily58
CONFIG_ZMK_STUDIO_LOCKING=n

# ---- Bluetooth reliability (applies to both halves) ----
# The vendor right-half defconfig sets this =n then later =y; the last one wins, so it ends up ON.
# ON is the known cause of "connected but not typing" on macOS/iOS. Force it off.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
# 2M PHY on both halves (vendor enables it only on the right). Better link margin for the split link.
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y
CONFIG_BT_CTLR_CONN_RSSI=y
# Deep sleep after 1 hour instead of 15 minutes: fewer wake/reconnect stalls during the workday.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
